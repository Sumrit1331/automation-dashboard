
name: Update Automation Dashboard

on:
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automation-dashboard-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect GitHub Actions status
        env:
          GH_READ_TOKEN: ${{ secrets.GH_READ_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          owner = "Sumrit1331"
          repos = [
              "gpd-cems-monitor",
              "garmin-health-line-bot",
              "garmin-health-charts",
          ]

          token = os.environ.get("GH_READ_TOKEN", "")
          if not token:
              raise SystemExit("Missing GH_READ_TOKEN")

          def get_json(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(
                  request, timeout=30
              ) as response:
                  return json.load(response)

          def parse_time(value):
              return datetime.fromisoformat(
                  value.replace("Z", "+00:00")
              )

          def thai_time(value):
              if not value:
                  return None
              return parse_time(value).astimezone(
                  ZoneInfo("Asia/Bangkok")
              ).strftime("%d/%m/%Y %H:%M")

          result = {
              "updated_at": datetime.now(
                  ZoneInfo("Asia/Bangkok")
              ).strftime("%d/%m/%Y %H:%M:%S"),
              "projects": {},
          }

          for repo in repos:
              url = (
                  f"https://api.github.com/repos/"
                  f"{owner}/{repo}/actions/runs?per_page=1"
              )
              response = get_json(url)
              runs = response.get("workflow_runs", [])

              item = {
                  "status": "waiting",
                  "last_run": None,
                  "duration": None,
              }

              if runs:
                  run = runs[0]

                  if run["status"] != "completed":
                      status = "running"
                  elif run.get("conclusion") == "success":
                      status = "success"
                  else:
                      status = "failure"

                  started = run.get("run_started_at")
                  updated = run.get("updated_at")
                  duration = None

                  if started and updated and (
                      run["status"] == "completed"
                  ):
                      seconds = max(
                          0,
                          int((
                              parse_time(updated)
                              - parse_time(started)
                          ).total_seconds())
                      )
                      duration = f"~{seconds // 60}m {seconds % 60}s"

                  item = {
                      "status": status,
                      "last_run": thai_time(
                          started or run.get("created_at")
                      ),
                      "duration": duration,
                  }

   
              # Detect delayed CEMS monitoring
              if repo == "gpd-cems-monitor" and runs:
                  last_run_time = runs[0].get("run_started_at")
                  if last_run_time:
                      age_minutes = (
                          datetime.now(timezone.utc)
                          - parse_time(last_run_time)
                      ).total_seconds() / 60

                      if age_minutes > 15 and item["status"] == "success":
                          item["status"] = "delayed"

              result["projects"][repo] = item
              print(repo, item["status"])
 



          with open(
              "status.json", "w", encoding="utf-8"
          ) as file:
              json.dump(
                  result, file,
                  ensure_ascii=False,
                  indent=2
              )
          PY

      - name: Commit dashboard status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update automation status"
            git push
          fi
